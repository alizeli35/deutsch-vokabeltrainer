name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/de/romandeutsch/vokabeltrainer/MainActivity.java
          test -f app/src/main/assets/index.html

      - name: Set version code
        shell: bash
        run: sed -i "s/versionCode 8/versionCode $((8 + ${{ github.run_number }}))/" app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-vokabeltrainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Deutsch-Vokabeltrainer.apk
          gh release create "build-${{ github.run_number }}" Deutsch-Vokabeltrainer.apk \
            --repo "${{ github.repository }}" \
            --title "Deutsch-Vokabeltrainer (Build ${{ github.run_number }})" \
            --notes "APK auf dem Android-Handy öffnen und installieren. Installation aus unbekannten Quellen erlauben." \
            --latest
